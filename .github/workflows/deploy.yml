name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:  # support manual trigger

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/interview-guide-app
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/interview-guide-frontend

jobs:
  # ===== Job 1: Build and push images to ghcr.io =====
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===== Build and push backend image =====
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== Build and push frontend image =====
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Job 2: Transfer images to server and restart =====
  # The server cannot reach ghcr.io directly (measured 0 bytes/min).
  # Solution: pull images on the GitHub runner (fast, overseas), stream them
  # via `docker save | gzip | ssh server docker load`, then restart compose.
  # Skipped automatically when SSH secrets are not configured.
  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    # secrets context is not allowed in job-level `if`, so map them to env first.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker pull ${{ env.APP_IMAGE }}:latest

      - name: Pull frontend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker pull ${{ env.FRONTEND_IMAGE }}:latest

      - name: Write SSH key
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Stream: docker save | gzip over ssh pipe straight into docker load,
      # avoiding slow scp of large tar files on the server.
      - name: Transfer and load backend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker save ${{ env.APP_IMAGE }}:latest | gzip | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.SSH_USERNAME }}@${{ env.SSH_HOST }} 'gunzip | docker load'

      - name: Transfer and load frontend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker save ${{ env.FRONTEND_IMAGE }}:latest | gzip | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.SSH_USERNAME }}@${{ env.SSH_HOST }} 'gunzip | docker load'

      - name: Restart on server
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.SSH_USERNAME }}@${{ env.SSH_HOST }} 'set -e; cd /opt/interview-guide && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f'

      - name: Skip notice
        if: ${{ env.SSH_HOST == '' }}
        run: echo "::warning::SSH Secrets not configured. Add SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY in repo Settings -> Secrets to enable auto deploy."