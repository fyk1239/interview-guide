name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:  # 支持手动触发

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/interview-guide-app
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/interview-guide-frontend

jobs:
  # ===== Job 1: 构建并推送镜像到 ghcr.io =====
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===== 构建 & 推送后端镜像 =====
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== 构建 & 推送前端镜像 =====
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Job 2: 将镜像传输到服务器并重启（secrets 未配置时自动跳过） =====
  # 服务器无法直连 ghcr.io（实测 0 字节/分钟），改为在 GitHub runner 上拉取镜像、
  # docker save 压缩后 scp 上传，服务器 docker load 后重启，全程不依赖服务器访问 ghcr。
  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    # secrets 上下文不能用于 job 级 if，改为引入 env 后判断
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & export backend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker pull ${{ env.APP_IMAGE }}:latest
          docker save ${{ env.APP_IMAGE }}:latest | gzip -1 > app-image.tar.gz
          ls -lh app-image.tar.gz

      - name: Pull & export frontend image
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          docker pull ${{ env.FRONTEND_IMAGE }}:latest
          docker save ${{ env.FRONTEND_IMAGE }}:latest | gzip -1 > frontend-image.tar.gz
          ls -lh frontend-image.tar.gz

      - name: Upload images to server
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "app-image.tar.gz,frontend-image.tar.gz"
          target: /opt/interview-guide/images

      - name: Load & restart on server
        if: ${{ env.SSH_HOST != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/interview-guide/images
            docker load < app-image.tar.gz
            docker load < frontend-image.tar.gz
            cd /opt/interview-guide
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Skip notice
        if: ${{ env.SSH_HOST == '' }}
        run: echo "::warning::SSH Secrets 未配置，跳过自动部署。请在仓库 Settings → Secrets 配置 SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY"
